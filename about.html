<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>3D Video Cube</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
  }

  video {
    position: absolute;
    object-fit: cover;
    pointer-events: none;
    filter: grayscale(100%) brightness(0.8);
    transition: filter 0.25s ease;
    will-change: transform;
  }

  video.active {
    filter: grayscale(0%) brightness(1);
  }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<script>
/* ================= CONFIG ================= */

const FACE_GRID = 4; // 4x4 por face
const CUBE_SIZE = 900;
const BASE_SIZE = 160;

const VIDEO_COUNT = FACE_GRID * FACE_GRID * 6;

const STREAM_DOMAIN = "https://customer-pz1quf3nakoocijj.cloudflarestream.com";

const videoIds = [
  "60c1d098633c336b9aa1bf156cffaff6",
  "b9cffa15ac0fe9a76e2105844206ae9e",
  "2dbd7a467c28852c4b0bda6f5548b338",
  "444dfeadade4cc92bd67b33079ad20b1",
  "6c933fc0db225e0aae9537c58c917025",
  "7ba8c716b6997540ca3a1b045119d62a",
  "e977b3c01aae4b32fa1f79b684f94f59",
  "0d839285f84ca2735622faa2de9c8802",
  "96573ba9ecc7bfff33caf52987b4b77e",
  "95f8921709a349fb766be6a2d2f6a8fd",
  "ece845ae8ca18aa6f2c6e442b5120c52"
];

/* ================= THREE ================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  1,
  5000
);

camera.position.z = 1400;

const renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ================= STATE ================= */

let items = [];

let rotation = { x: 0, y: 0 };
let targetRotation = { x: 0, y: 0 };

let isDragging = false;
let prevMouse = { x: 0, y: 0 };

/* ================= CREATE CUBE ================= */

function createFace(axis, sign) {
  const half = CUBE_SIZE / 2;
  const spacing = CUBE_SIZE / FACE_GRID;

  for (let i = 0; i < FACE_GRID; i++) {
    for (let j = 0; j < FACE_GRID; j++) {

      let x = (i - FACE_GRID/2 + 0.5) * spacing;
      let y = (j - FACE_GRID/2 + 0.5) * spacing;
      let z = 0;

      // posiciona face
      if (axis === "z") z = sign * half;
      if (axis === "x") {
        z = x;
        x = sign * half;
      }
      if (axis === "y") {
        z = y;
        y = sign * half;
      }

      createVideo(x, y, z);
    }
  }
}

function createVideo(x, y, z) {
  const id = videoIds[items.length % videoIds.length];

  const video = document.createElement("video");
  video.src = `${STREAM_DOMAIN}/${id}/downloads/default.mp4`;

  video.muted = true;
  video.setAttribute("muted", "");
  video.loop = true;
  video.playsInline = true;
  video.autoplay = true;

  video.addEventListener("canplay", () => {
    video.play().catch(() => {});
  });

  document.body.appendChild(video);

  items.push({
    el: video,
    x, y, z,
    size: BASE_SIZE * (0.85 + Math.random() * 0.3)
  });
}

// 6 faces
createFace("z", 1);
createFace("z", -1);
createFace("x", 1);
createFace("x", -1);
createFace("y", 1);
createFace("y", -1);

/* ================= INTERACTION ================= */

window.addEventListener("mousedown", (e) => {
  isDragging = true;
  prevMouse.x = e.clientX;
  prevMouse.y = e.clientY;
});

window.addEventListener("mouseup", () => {
  isDragging = false;
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;

  targetRotation.y += dx * 0.005;
  targetRotation.x += dy * 0.005;

  prevMouse.x = e.clientX;
  prevMouse.y = e.clientY;
});

/* ================= RENDER ================= */

function animate() {
  requestAnimationFrame(animate);

  rotation.x += (targetRotation.x - rotation.x) * 0.08;
  rotation.y += (targetRotation.y - rotation.y) * 0.08;

  items.forEach(item => {

    let x = item.x;
    let y = item.y;
    let z = item.z;

    // rotate Y
    let cosY = Math.cos(rotation.y);
    let sinY = Math.sin(rotation.y);
    let dx = cosY * x - sinY * z;
    let dz = sinY * x + cosY * z;

    // rotate X
    let cosX = Math.cos(rotation.x);
    let sinX = Math.sin(rotation.x);
    let dy = cosX * y - sinX * dz;
    dz = sinX * y + cosX * dz;

    // perspective
    const scale = 1400 / (1400 + dz);
    const screenX = dx * scale + window.innerWidth / 2;
    const screenY = dy * scale + window.innerHeight / 2;

    const size = item.size * scale;

    const el = item.el;

    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.transform = `translate(${screenX}px, ${screenY}px)`;
    el.style.zIndex = Math.floor(scale * 1000);

    // hover centro
    const mx = window.innerWidth / 2;
    const my = window.innerHeight / 2;

    const dist = Math.hypot(screenX - mx, screenY - my);

    if (dist < size * 0.5) {
      el.classList.add("active");
    } else {
      el.classList.remove("active");
    }
  });

  renderer.render(scene, camera);
}

animate();

/* ================= RESIZE ================= */

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
