<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Organic Video Cube</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
  }

  video {
    position: absolute;
    object-fit: cover;
    pointer-events: none;
    filter: grayscale(100%) brightness(0.8);
    transition: filter 0.25s ease;
    will-change: transform;
  }

  video.active {
    filter: grayscale(0%) brightness(1);
  }
</style>
</head>
<body>

<script>
/* ================= CONFIG ================= */

const VIDEO_COUNT = 42;
const RADIUS = 900;
const BASE_SIZE = 170;

const STREAM_DOMAIN = "https://customer-pz1quf3nakoocijj.cloudflarestream.com";

const videoIds = [
  "60c1d098633c336b9aa1bf156cffaff6",
  "b9cffa15ac0fe9a76e2105844206ae9e",
  "2dbd7a467c28852c4b0bda6f5548b338",
  "444dfeadade4cc92bd67b33079ad20b1",
  "6c933fc0db225e0aae9537c58c917025",
  "7ba8c716b6997540ca3a1b045119d62a",
  "e977b3c01aae4b32fa1f79b684f94f59",
  "0d839285f84ca2735622faa2de9c8802",
  "96573ba9ecc7bfff33caf52987b4b77e",
  "95f8921709a349fb766be6a2d2f6a8fd",
  "ece845ae8ca18aa6f2c6e442b5120c52"
];

/* ================= MATH ================= */

function point3(x, y, z) {
  return { x, y, z };
}

function rotateX(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return point3(p.x, p.y * c - p.z * s, p.y * s + p.z * c);
}

function rotateY(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return point3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c);
}

/* ================= DISTRIBUTION ================= */

// Fibonacci sphere
function fibonacciSphere(i, total) {
  const phi = Math.acos(-1 + (2 * i) / total);
  const theta = Math.sqrt(total * Math.PI) * phi;

  return point3(
    Math.cos(theta) * Math.sin(phi),
    Math.sin(theta) * Math.sin(phi),
    Math.cos(phi)
  );
}

// sphere → cube (🔥 chave do visual)
function sphereToCube(p) {
  const ax = Math.abs(p.x);
  const ay = Math.abs(p.y);
  const az = Math.abs(p.z);

  const max = Math.max(ax, ay, az);

  return point3(
    p.x / max,
    p.y / max,
    p.z / max
  );
}

/* ================= STATE ================= */

let items = [];
let rotX = 0;
let rotY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;
let px = 0, py = 0;

/* ================= CREATE ================= */

function create() {
  for (let i = 0; i < VIDEO_COUNT; i++) {

    let p = fibonacciSphere(i, VIDEO_COUNT);
    p = sphereToCube(p);

    // leve flatten (estética)
    p.y *= 0.8;

    // escala
    p.x *= RADIUS;
    p.y *= RADIUS;
    p.z *= RADIUS;

    // ruído leve (orgânico)
    p.x += (Math.random() - 0.5) * 40;
    p.y += (Math.random() - 0.5) * 40;
    p.z += (Math.random() - 0.5) * 40;

    const id = videoIds[i % videoIds.length];

    const v = document.createElement("video");
    v.src = `${STREAM_DOMAIN}/${id}/downloads/default.mp4`;

    v.muted = true;
    v.setAttribute("muted", "");
    v.autoplay = true;
    v.loop = true;
    v.playsInline = true;

    v.onloadeddata = () => {
      v.play().catch(()=>{});
    };

    document.body.appendChild(v);

    items.push({
      el: v,
      x: p.x,
      y: p.y,
      z: p.z,
      size: BASE_SIZE * (0.85 + Math.random() * 0.3)
    });
  }
}

/* ================= INTERACTION ================= */

window.onmousedown = (e) => {
  dragging = true;
  px = e.clientX;
  py = e.clientY;
};

window.onmouseup = () => dragging = false;

window.onmousemove = (e) => {
  if (!dragging) return;

  targetY += (e.clientX - px) * 0.005;
  targetX += (e.clientY - py) * 0.005;

  px = e.clientX;
  py = e.clientY;
};

/* ================= LOOP ================= */

function loop() {
  requestAnimationFrame(loop);

  rotX += (targetX - rotX) * 0.08;
  rotY += (targetY - rotY) * 0.08;

  items.forEach(o => {

    let p = point3(o.x, o.y, o.z);

    p = rotateY(p, rotY);
    p = rotateX(p, rotX);

    const scale = 1200 / (1200 + p.z);

    const sx = p.x * scale + innerWidth / 2;
    const sy = p.y * scale + innerHeight / 2;

    const size = o.size * scale;

    const el = o.el;

    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.transform = `translate(${sx}px, ${sy}px)`;
    el.style.zIndex = (scale * 1000) | 0;

    // hover central (simples e leve)
    const d = Math.hypot(sx - innerWidth/2, sy - innerHeight/2);
    el.classList.toggle("active", d < size * 0.5);
  });
}

/* ================= INIT ================= */

window.onload = () => {
  create();
  loop();
};
</script>

</body>
</html>
