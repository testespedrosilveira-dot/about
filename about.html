<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cube Videos SAFE</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
  }

  video {
    position: absolute;
    object-fit: cover;
    pointer-events: none;
    filter: grayscale(100%) brightness(0.8);
    transition: filter 0.25s ease;
  }

  video.active {
    filter: grayscale(0%) brightness(1);
  }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<script>
window.addEventListener("load", () => {

  if (!window.THREE) {
    document.body.innerHTML = "<h1 style='color:white'>Three.js não carregou</h1>";
    return;
  }

  const FACE_GRID = 3;
  const CUBE_SIZE = 800;
  const BASE_SIZE = 160;

  const STREAM_DOMAIN = "https://customer-pz1quf3nakoocijj.cloudflarestream.com";

  const videoIds = [
    "60c1d098633c336b9aa1bf156cffaff6",
    "b9cffa15ac0fe9a76e2105844206ae9e",
    "2dbd7a467c28852c4b0bda6f5548b338"
  ];

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    1,
    5000
  );

  camera.position.z = 1200;

  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  let items = [];

  function createVideo(x, y, z) {
    const id = videoIds[items.length % videoIds.length];

    const v = document.createElement("video");
    v.src = `${STREAM_DOMAIN}/${id}/downloads/default.mp4`;

    v.muted = true;
    v.setAttribute("muted", "");
    v.autoplay = true;
    v.loop = true;
    v.playsInline = true;

    v.onloadeddata = () => {
      v.play().catch(()=>{});
    };

    document.body.appendChild(v);

    items.push({ el: v, x, y, z, size: BASE_SIZE });
  }

  function createCube() {
    const half = CUBE_SIZE / 2;
    const step = CUBE_SIZE / FACE_GRID;

    for (let i = 0; i < FACE_GRID; i++) {
      for (let j = 0; j < FACE_GRID; j++) {

        let px = (i - FACE_GRID/2 + 0.5) * step;
        let py = (j - FACE_GRID/2 + 0.5) * step;

        createVideo(px, py, half);
        createVideo(px, py, -half);
        createVideo(half, px, py);
        createVideo(-half, px, py);
        createVideo(px, half, py);
        createVideo(px, -half, py);
      }
    }
  }

  createCube();

  let rotX = 0;
  let rotY = 0;

  let dragging = false;
  let px = 0, py = 0;

  window.onmousedown = (e) => {
    dragging = true;
    px = e.clientX;
    py = e.clientY;
  };

  window.onmouseup = () => dragging = false;

  window.onmousemove = (e) => {
    if (!dragging) return;

    rotY += (e.clientX - px) * 0.005;
    rotX += (e.clientY - py) * 0.005;

    px = e.clientX;
    py = e.clientY;
  };

  function loop() {
    requestAnimationFrame(loop);

    items.forEach(o => {
      let x = o.x, y = o.y, z = o.z;

      let cosY = Math.cos(rotY);
      let sinY = Math.sin(rotY);
      let dx = cosY * x - sinY * z;
      let dz = sinY * x + cosY * z;

      let cosX = Math.cos(rotX);
      let sinX = Math.sin(rotX);
      let dy = cosX * y - sinX * dz;
      dz = sinX * y + cosX * dz;

      let scale = 1200 / (1200 + dz);

      let sx = dx * scale + innerWidth/2;
      let sy = dy * scale + innerHeight/2;

      let size = o.size * scale;

      const el = o.el;

      el.style.width = size + "px";
      el.style.height = size + "px";
      el.style.transform = `translate(${sx}px, ${sy}px)`;
      el.style.zIndex = (scale * 1000)|0;

      // hover simples
      let d = Math.hypot(sx - innerWidth/2, sy - innerHeight/2);

      el.classList.toggle("active", d < size * 0.5);
    });

    renderer.render(scene, camera);
  }

  loop();

});
</script>

</body>
</html>
